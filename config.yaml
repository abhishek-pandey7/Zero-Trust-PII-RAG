version: "1.0"

llm:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2

chroma:
  persist_directory: "./chroma_store"

splitter:
  chunk_size: 500
  chunk_overlap: 100
  separators: ["\n\n", "\n", " ", ""]

retrieval:
  top_k: 3

presidio:
  entity_types:
    - PERSON
    - EMAIL_ADDRESS
    - PHONE_NUMBER
    - US_SSN
    - CREDIT_CARD
    - IBAN_CODE
    - IP_ADDRESS
    - URL
    - LOCATION
    - DATE_TIME
    - NRP
    - MEDICAL_LICENSE
    - US_PASSPORT
    - US_DRIVER_LICENSE
    - IN_PAN
    - IN_AADHAAR
  score_threshold: 0.3

security:
  audit_log_path: "./audit.log"
  vault_db_path: "./vault.db"
  max_retries: 3
  retry_delay: 1.0
