[project]
name = "zero-trust-pii-rag"
version = "1.1.0"
description = "RAG over sensitive documents where external models only ever see opaque PII tokens."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads the spaCy model or other heavy resources",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["venv", "prep", "docs"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import order, bugbear, and pyupgrade
select = ["F", "E4", "E7", "E9", "I", "B", "UP"]
