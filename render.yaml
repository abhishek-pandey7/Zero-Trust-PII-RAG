# Render free plan: 512 MB RAM, sleeps after 15 minutes idle, disk wiped on every deploy and restart.
services:
  - type: web
    name: zero-trust-pii-rag
    runtime: python
    plan: free
    # The embedding model is fetched at build time so the first request after a deploy doesn't
    # wait on an 80 MB download
    buildCommand: pip install -r requirements.txt && python scripts/prefetch_models.py
    # One process (one copy of the models in memory), threads for concurrency. --timeout covers
    # the slowest request: a large upload being redacted.
    startCommand: gunicorn --worker-class gthread --threads 8 --workers 1 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # glibc gives each thread its own malloc arena by default; two keeps memory flat under threads
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Peak memory is ~450 MB at 25,000 characters per request; refuse bigger inputs, don't crash
      - key: ZT_MAX_INPUT_CHARS
        value: "30000"
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
