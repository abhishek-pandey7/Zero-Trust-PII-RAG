version: "1.0"

llm:
  provider: groq
  # Groq retired the Llama 3.x models. gpt-oss-120b keeps placeholders verbatim; gpt-oss-20b was
  # tested too and refused to answer questions phrased around placeholders.
  model: openai/gpt-oss-120b
  reasoning_effort: low
  temperature: 0
  timeout_seconds: 30
  # transient errors (timeouts, 429, 5xx) are retried with jittered exponential backoff
  max_attempts: 3

# Embeddings are computed locally (all-MiniLM-L6-v2 on ONNX Runtime), so chunks never leave the
# process to be embedded. The LLM call is the only egress.
embeddings:
  provider: local
  model: all-MiniLM-L6-v2

chroma:
  persist_directory: "./chroma_store"

splitter:
  chunk_size: 500
  chunk_overlap: 100

retrieval:
  top_k: 10

presidio:
  entity_types:
    - PERSON
    - EMAIL_ADDRESS
    - PHONE_NUMBER
    - US_SSN
    - CREDIT_CARD
    - IBAN_CODE
    - IP_ADDRESS
    - URL
    - LOCATION
    - DATE_TIME
    - NRP
    - MEDICAL_LICENSE
    - US_PASSPORT
    - US_DRIVER_LICENSE
    - US_BANK_NUMBER
    - US_ITIN
    - IN_PAN
    - IN_AADHAAR
  # 0.4 is Presidio's floor for a weak pattern that has a context word nearby (e.g. a bare 9-digit
  # number next to "social security"). Weak patterns with no context score lower and are ignored.
  # 0.6 used to silently drop those, and in a PII system a miss is a leak.
  score_threshold: 0.4

security:
  audit_log_path: "./audit.log"
  vault_db_path: "./vault.db"
