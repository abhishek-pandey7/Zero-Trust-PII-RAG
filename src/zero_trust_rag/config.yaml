version: "1.0"

llm:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2

chroma:
  persist_directory: "./chroma_store"

splitter:
  chunk_size: 500
  chunk_overlap: 100
  separators: ["\n\n", "\n", " ", ""]

retrieval:
  top_k: 20

presidio:
  entity_types:
    - PERSON
    - EMAIL_ADDRESS
    - PHONE_NUMBER
    - US_SSN
    - CREDIT_CARD
    - IBAN_CODE
    - IP_ADDRESS
    - URL
    - LOCATION
    - DATE_TIME
    - NRP
    - MEDICAL_LICENSE
    - US_PASSPORT
    - US_DRIVER_LICENSE
    - US_BANK_NUMBER
    - US_ITIN
    - IN_PAN
    - IN_AADHAAR
  # 0.4 is Presidio's floor for a weak pattern that has a context word nearby (e.g. a bare 9-digit
  # number next to "social security"). Weak patterns with no context score lower and are ignored.
  # 0.6 used to silently drop those, and in a PII system a miss is a leak.
  score_threshold: 0.4

security:
  audit_log_path: "./audit.log"
  vault_db_path: "./vault.db"
  max_retries: 3
  retry_delay: 1.0